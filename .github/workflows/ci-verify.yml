name: Verify MockChain Examples
on:
  push:
    branches:
      - ci/verify-examples
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: cat node_modules/@fleet-sdk/mock-chain/dist/index.mjs | head -n 120 || true
      - run: npm run test
      - run: npx tsc --noEmit
