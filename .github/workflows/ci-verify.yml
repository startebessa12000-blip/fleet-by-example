name: Verify MockChain Examples
on:
  push:
    branches:
      - ci/verify-examples
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Test unmodified tokenless box behavior under sellerPK
        run: |
          cat << 'EOF' > tests/reproTokenless.spec.ts
          import { MockChain } from "@fleet-sdk/mock-chain";
          import { compile } from "@fleet-sdk/compiler";
          import { OutputBuilder, SGroupElement, SLong, SSigmaProp, TransactionBuilder } from "@fleet-sdk/core";
          import { describe, it } from "vitest";
          import fs from "node:fs";

          describe("Check tokenless box under unmodified sale script", () => {
            it("Logs whether unmodified script allows sellerPK to sweep a tokenless UTxO", () => {
              const src = fs.readFileSync("tests/selfReplicatingTokenSaleContract.spec.ts", "utf8");
              const m = src.match(/const SELF_REPLICATING_TOKEN_SALE_SCRIPT = `([\s\S]*?)`;/);
              const mockChain = new MockChain({ height: 1_052_944 });
              const seller = mockChain.newParty("Seller");
              const tree = compile(m![1], {
                map: {
                  sellerPK: SSigmaProp(SGroupElement(seller.key.publicKey)),
                  pricePerToken: SLong(10_000_000n)
                }
              });
              const contract = mockChain.addParty(tree.toHex(), "Sale");
              contract.addBalance({ nanoergs: 5_000_000n, tokens: [] });
              const tx = new TransactionBuilder(mockChain.height)
                .from(contract.utxos)
                .to(new OutputBuilder(3_900_000n, seller.address))
                .payMinFee()
                .build();
              try {
                const ok = mockChain.execute(tx, { signers: [seller] });
                console.log("UNMODIFIED_TOKENLESS_SELLER_SWEEP_RESULT:", ok);
              } catch (err: any) {
                console.log("UNMODIFIED_TOKENLESS_SELLER_SWEEP_ERROR:", err?.message || String(err));
              }
            });
          });
          EOF
          npx vitest run tests/reproTokenless.spec.ts
